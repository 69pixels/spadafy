<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spadafy — The Tech</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Placeholder: the Tech page is not designed yet. This is the landing frame
       the homepage transition hands over to ("loading phase 03"). */
    .tech-hero { position: relative; height: var(--vh); display: grid; place-items: center; overflow: hidden; background: var(--panel-grey); color: var(--white); }
    .tech-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .tech-hero::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.2); }
    .tech-hero h1 { position: relative; z-index: 1; font-family: var(--f-display); font-weight: 700; font-size: calc(140 * var(--u)); line-height: .84; text-align: center; }
    .tech-back { position: absolute; z-index: 1; left: var(--margin); bottom: var(--margin); font-weight: 500; font-size: calc(16 * var(--u)); color: var(--soft-60); transition: color .2s; }
    .tech-back:hover { color: var(--white); }
    @media (max-width: 820px) { .tech-hero h1 { font-size: 72px; } .tech-back { left: 16px; bottom: 24px; font-size: 14px; } }
    .tech-hero h1 { animation: techIn 1s cubic-bezier(.22,1,.36,1) both; }
    @keyframes techIn { from { opacity: 0; transform: translateY(12px); } }
  </style>
</head>
<body>
  <header class="nav" data-state="collapsed">
    <a class="nav-pill" href="index.html#services" aria-label="Back to the homepage">
      <img src="assets/icons/logo-s.svg" width="54" height="28" alt="">
      <span class="nav-pill-icon"><img src="assets/icons/icon-burger.svg" width="32" height="32" alt=""></span>
    </a>
  </header>
  <main class="tech-hero">
    <img src="assets/img/tech.jpg" alt="">
    <h1>The Tech</h1>
    <a class="tech-back" href="index.html">← Back to Home</a>
  </main>
  <script>
    const r = document.documentElement;
    const set = () => { r.style.setProperty('--u', r.clientWidth / 1920 + 'px'); r.style.setProperty('--vh', innerHeight + 'px'); };
    set(); addEventListener('resize', set);
  </script>
</body>
</html>
