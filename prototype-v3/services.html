<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spadafy — Services</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Placeholder: the Services page is not designed yet. This is the landing frame
       the homepage "fall into the next page" hands over to. */
    .page-hero { position: relative; height: var(--vh); display: grid; place-items: center; overflow: hidden; background: #515151; color: var(--white); }
    .page-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .page-hero::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.2); }
    .page-hero h1 { position: relative; z-index: 1; font-family: var(--f-display); font-weight: 700; font-size: calc(140 * var(--u)); line-height: .84; text-align: center; animation: pageIn 1s var(--ease-out) both; }
    .page-back { position: absolute; z-index: 1; left: calc(40 * var(--u)); bottom: calc(40 * var(--u)); font-weight: 500; font-size: calc(16 * var(--u)); color: var(--soft-60); transition: color .2s; }
    .page-back:hover { color: var(--white); }
    @keyframes pageIn { from { opacity: 0; transform: translateY(12px); } }
  </style>
</head>
<body>
  <header class="nav" data-state="collapsed">
    <div class="nav-box">
      <div class="nav-row">
        <a class="nav-logo" href="index.html" aria-label="Spadafy — back to the homepage"><img class="logo-s" src="assets/icons/menu-logo.svg" alt="" style="opacity:1"></a>
        <div class="nav-cta-wrap"><a class="nav-cta" href="index.html#cta">Let’s talk</a></div>
      </div>
    </div>
  </header>
  <main class="page-hero">
    <img src="assets/img/outro-services.jpg" alt="">
    <h1>Services</h1>
    <a class="page-back" href="index.html">← Back to Home</a>
  </main>
  <script>
    const r = document.documentElement;
    const set = () => { r.style.setProperty('--u', r.clientWidth / 1920 + 'px'); r.style.setProperty('--vh', innerHeight + 'px'); };
    set(); addEventListener('resize', set);
  </script>
</body>
</html>
